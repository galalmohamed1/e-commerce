<!DOCTYPE html>
<html lang="en" dir="ltr">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="My Store - modern everyday essentials">
        <title>My Store | Everyday essentials</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <script src="https://unpkg.com/lucide@latest"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>
        <div class="loading hidden">
            <span class="loader"></span>
        </div>
        <header class="site-header">
            <nav class="container navbar">
                <a href="index.html" class="brand">
                    My
                    <span>.</span>
                    Store
                </a>
                <div class="nav-actions">
                    <button id="themeBtn" class="icon-button" aria-label="Toggle dark mode">
                        <i data-lucide="sun-moon"></i>
                    </button>
                </div>
            </nav>
        </header>
        <main>
            <section class="hero hero-grid">
                <div class="container hero-content flex-row items-center justify-between">
                    <div class="w-50">
                        <p class="eyebrow">Curated for every day</p>
                        <h1>
                            Style with a 
                            <span>point of view.</span>
                        </h1>
                        <p class="hero-description">Thoughtful pieces, made to last and chosen to fit beautifully into your wardrobe.</p>
                    </div>
                    <div>
                        <h2>Shopping Cart</h2>
                        <div class="p-4" id="addcart"></div>
                        <h2 class="text-xl font-bold pt-6" id="totalAmount"></h2>
                    </div>
                </div>
            </section>
            <section class="container products-section">
                <div class="filter-panel">
                    <label class="search-field">
                        <i data-lucide="search"></i>
                        <input
                            type="search"
                            placeholder="Search products..."
                            id="searchInput"
                            aria-label="Search products"
                        >
                    </label>
                    <select id="selectCategory">
                        <option value="all">All categories</option>
                        <option value="men's clothing">Men's</option>
                        <option value="women's clothing">Women's</option>
                        <option value="jewelery">Jewelery</option>
                        <option value="electronics">Electronics</option>
                    </select>
                    
                    <select id="sortCategory">
                        <option value="name">Sort by Name</option>
                        <option value="price">Sort by Price</option>
                        <option value="rating">Sort by Rating</option>
                    </select>
                    <button class="filter-button">Apply Filters</button>
                </div>
                <div class="section-heading">
                    <div>
                        <p class="eyebrow">The collection</p>
                        <h2>Everyday essentials</h2>
                    </div>
                </div>
                <div class="product-grid" id="rowData"></div>
                <div class="product-grid" id="productGrid"></div>
                <div class="pagination" id="pagination"></div>
            </section>
            <section class="light-container fixed inset-0 z-50 hidden flex items-center justify-center text-white bg-slate-950/60 p-4">
                <div class="box relative h-1/2 w-1/2 rounded-2xl bg-white shadow-2xl dark:bg-slate-900">
                    <svg
                        id="closed"
                        class="pointer absolute right-0 top-0 m-2 h-7 w-7 cursor-pointer fill-slate-600 hover:fill-orange-500 dark:fill-slate-300"
                        xmlns="http://www.w3.org/2000/svg"
                        viewBox="0 0 640 640"
                    >
                        <path d="M320 576C461.4 576 576 461.4 576 320C576 178.6 461.4 64 320 64C178.6 64 64 178.6 64 320C64 461.4 178.6 576 320 576zM231 231C240.4 221.6 255.6 221.6 264.9 231L319.9 286L374.9 231C384.3 221.6 399.5 221.6 408.8 231C418.1 240.4 418.2 255.6 408.8 264.9L353.8 319.9L408.8 374.9C418.2 384.3 418.2 399.5 408.8 408.8C399.4 418.1 384.2 418.2 374.9 408.8L319.9 353.8L264.9 408.8C255.5 418.2 240.3 418.2 231 408.8C221.7 399.4 221.6 384.2 231 374.9L286 319.9L231 264.9C221.6 255.5 221.6 240.3 231 231z"/>
                    </svg>
                    <div id="show"></div>
                </div>
            </section>
        </main>
        <script>lucide.createIcons();</script>
        <script src="app.js"></script>
    </body>
</html>
